<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600"><rect width="100%" height="100%" fill="white"/><text x="900" y="65" text-anchor="middle" font-family="Microsoft YaHei" font-size="46" fill="#202329">两种主要输入方式的比较</text><rect x="80.0" y="130" width="503.3333333333333" height="145" rx="12" fill="#D9E8FB" stroke="#527A9B" stroke-width="3"/><text x="331.66666666666663" y="185" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">只看当前数据</text><text x="331.66666666666663" y="233" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">输入当前分钟特征</text><path d="M589.3333333333333,202 h51 l-13,-9 m13,9 l-13,9" fill="none" stroke="#527A9B" stroke-width="4"/><rect x="648.3333333333333" y="130" width="503.3333333333333" height="145" rx="12" fill="#E2D5E7" stroke="#527A9B" stroke-width="3"/><text x="899.9999999999999" y="185" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">自编码器学习正常样本</text><text x="899.9999999999999" y="233" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">比较输入和恢复结果</text><path d="M1157.6666666666665,202 h51 l-13,-9 m13,9 l-13,9" fill="none" stroke="#527A9B" stroke-width="4"/><rect x="1216.6666666666665" y="130" width="503.3333333333333" height="145" rx="12" fill="#F3FEF6" stroke="#527A9B" stroke-width="3"/><text x="1468.3333333333333" y="185" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">输出异常分数</text><text x="1468.3333333333333" y="233" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">超过阈值时报警</text><rect x="80.0" y="350" width="503.3333333333333" height="145" rx="12" fill="#D9E8FB" stroke="#527A9B" stroke-width="3"/><text x="331.66666666666663" y="405" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">结合近期数据</text><text x="331.66666666666663" y="453" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">输入当前特征与差值</text><path d="M589.3333333333333,422 h51 l-13,-9 m13,9 l-13,9" fill="none" stroke="#527A9B" stroke-width="4"/><rect x="648.3333333333333" y="350" width="503.3333333333333" height="145" rx="12" fill="#E2D5E7" stroke="#527A9B" stroke-width="3"/><text x="899.9999999999999" y="405" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">使用相同类型的模型</text><text x="899.9999999999999" y="453" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">保持可比的训练条件</text><path d="M1157.6666666666665,422 h51 l-13,-9 m13,9 l-13,9" fill="none" stroke="#527A9B" stroke-width="4"/><rect x="1216.6666666666665" y="350" width="503.3333333333333" height="145" rx="12" fill="#F3FEF6" stroke="#527A9B" stroke-width="3"/><text x="1468.3333333333333" y="405" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">用同一批测试数据</text><text x="1468.3333333333333" y="453" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">核对误报和漏报</text></svg>