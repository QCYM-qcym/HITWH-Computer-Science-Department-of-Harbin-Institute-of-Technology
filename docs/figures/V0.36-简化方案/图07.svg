<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820"><rect width="100%" height="100%" fill="white"/><text x="900" y="65" text-anchor="middle" font-family="Microsoft YaHei" font-size="46" fill="#202329">同一份数据怎样进行测试</text><rect x="80.0" y="130" width="503.3333333333333" height="145" rx="12" fill="#D9E8FB" stroke="#527A9B" stroke-width="3"/><text x="331.66666666666663" y="185" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">较早数据用于训练</text><path d="M589.3333333333333,202 h51 l-13,-9 m13,9 l-13,9" fill="none" stroke="#527A9B" stroke-width="4"/><rect x="648.3333333333333" y="130" width="503.3333333333333" height="145" rx="12" fill="#E2D5E7" stroke="#527A9B" stroke-width="3"/><text x="899.9999999999999" y="185" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">验证数据确定参数和阈值</text><path d="M1157.6666666666665,202 h51 l-13,-9 m13,9 l-13,9" fill="none" stroke="#527A9B" stroke-width="4"/><rect x="1216.6666666666665" y="130" width="503.3333333333333" height="145" rx="12" fill="#F3FEF6" stroke="#527A9B" stroke-width="3"/><text x="1468.3333333333333" y="185" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">测试数据保留到最后</text><rect x="80.0" y="350" width="503.3333333333333" height="145" rx="12" fill="#D9E8FB" stroke="#527A9B" stroke-width="3"/><text x="331.66666666666663" y="405" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">两种方法检测同一批分钟</text><path d="M589.3333333333333,422 h51 l-13,-9 m13,9 l-13,9" fill="none" stroke="#527A9B" stroke-width="4"/><rect x="648.3333333333333" y="350" width="503.3333333333333" height="145" rx="12" fill="#E2D5E7" stroke="#527A9B" stroke-width="3"/><text x="899.9999999999999" y="405" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">预测与独立标签逐条核对</text><path d="M1157.6666666666665,422 h51 l-13,-9 m13,9 l-13,9" fill="none" stroke="#527A9B" stroke-width="4"/><rect x="1216.6666666666665" y="350" width="503.3333333333333" height="145" rx="12" fill="#F3FEF6" stroke="#527A9B" stroke-width="3"/><text x="1468.3333333333333" y="405" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">比较误报、漏报和召回</text><rect x="80.0" y="570" width="503.3333333333333" height="145" rx="12" fill="#D9E8FB" stroke="#527A9B" stroke-width="3"/><text x="331.66666666666663" y="625" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">正常且报警：误报</text><rect x="648.3333333333333" y="570" width="503.3333333333333" height="145" rx="12" fill="#E2D5E7" stroke="#527A9B" stroke-width="3"/><text x="899.9999999999999" y="625" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">攻击却未报警：漏报</text><rect x="1216.6666666666665" y="570" width="503.3333333333333" height="145" rx="12" fill="#F3FEF6" stroke="#527A9B" stroke-width="3"/><text x="1468.3333333333333" y="625" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">误报减少时</text><text x="1468.3333333333333" y="673" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">仍需检查漏报</text></svg>