<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600"><rect width="100%" height="100%" fill="white"/><text x="900" y="65" text-anchor="middle" font-family="Microsoft YaHei" font-size="46" fill="#202329">一分钟数据包含什么</text><rect x="80.0" y="130" width="503.3333333333333" height="145" rx="12" fill="#D9E8FB" stroke="#527A9B" stroke-width="3"/><text x="331.66666666666663" y="185" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">作者提供的分钟数据</text><text x="331.66666666666663" y="233" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">每分钟一行</text><path d="M589.3333333333333,202 h51 l-13,-9 m13,9 l-13,9" fill="none" stroke="#527A9B" stroke-width="4"/><rect x="648.3333333333333" y="130" width="503.3333333333333" height="145" rx="12" fill="#E2D5E7" stroke="#527A9B" stroke-width="3"/><text x="899.9999999999999" y="185" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">134个统计字段</text><text x="899.9999999999999" y="233" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">每列是一类条件计数</text><path d="M1157.6666666666665,202 h51 l-13,-9 m13,9 l-13,9" fill="none" stroke="#527A9B" stroke-width="4"/><rect x="1216.6666666666665" y="130" width="503.3333333333333" height="145" rx="12" fill="#F3FEF6" stroke="#527A9B" stroke-width="3"/><text x="1468.3333333333333" y="185" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">独立标签</text><text x="1468.3333333333333" y="233" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">用于最后核对结果</text><rect x="80.0" y="350" width="503.3333333333333" height="145" rx="12" fill="#D9E8FB" stroke="#527A9B" stroke-width="3"/><text x="331.66666666666663" y="405" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">协议、端口等条件</text><text x="331.66666666666663" y="453" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">反映流记录的组成</text><rect x="648.3333333333333" y="350" width="503.3333333333333" height="145" rx="12" fill="#E2D5E7" stroke="#527A9B" stroke-width="3"/><text x="899.9999999999999" y="405" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">包数、字节数区间</text><text x="899.9999999999999" y="453" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">统计落入区间的记录数</text><rect x="1216.6666666666665" y="350" width="503.3333333333333" height="145" rx="12" fill="#F3FEF6" stroke="#527A9B" stroke-width="3"/><text x="1468.3333333333333" y="405" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">同一记录可重复命中</text><text x="1468.3333333333333" y="453" text-anchor="middle" font-family="Microsoft YaHei" font-size="40" fill="#202329">各列不能直接相加</text></svg>