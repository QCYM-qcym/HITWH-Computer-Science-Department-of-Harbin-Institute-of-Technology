openapi: 3.1.0
info:
  title: Offline Traffic Anomaly API
  version: '1.0'
paths:
  /api/v1/datasets:
    get:
      operationId: DatasetList
      responses:
        '200':
          description: DatasetList
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetList'
              examples:
                synthetic_1:
                  summary: SYNTHETIC_ONLY
                  value:
                    items:
                    - dataset_id: synthetic-v1
                      version: manual-v1
                      evidence_kind: SYNTHETIC_ONLY
                      available: true
                      unavailable_reason: null
                      time_range:
                        start: '2026-01-01T00:00:00Z'
                        end: '2026-01-01T00:04:00Z'
                      feature_count: 134
                      split_ids:
                      - split-v1
                      config_ids:
                      - smoke-v1
        '404':
          description: ErrorResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                synthetic_1:
                  summary: SYNTHETIC_ONLY
                  value: &id001
                    error:
                      code: NOT_FOUND
                      message: Synthetic example
                      details: []
        '409':
          description: ErrorResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                synthetic_1:
                  summary: SYNTHETIC_ONLY
                  value: &id004
                    error:
                      code: RESULT_NOT_READY
                      message: Synthetic example
                      details: []
        '422':
          description: ErrorResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                synthetic_1:
                  summary: SYNTHETIC_ONLY
                  value: &id002
                    error:
                      code: VALIDATION_ERROR
                      message: Synthetic example
                      details: []
        '500':
          description: ErrorResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                synthetic_1:
                  summary: SYNTHETIC_ONLY
                  value: &id003
                    error:
                      code: EXECUTION_FAILED
                      message: Synthetic example
                      details: []
