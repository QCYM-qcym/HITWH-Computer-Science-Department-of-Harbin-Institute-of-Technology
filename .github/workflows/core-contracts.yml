name: 核心契约检查
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e 'src/core[dev]'
      - run: python -m pytest tests/core/test_contracts.py -q
      - run: python tools/contracts/export_openapi.py --check
