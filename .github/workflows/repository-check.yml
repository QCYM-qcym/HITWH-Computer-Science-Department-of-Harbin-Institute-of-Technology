name: 文档与发布检查
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 仓库维护工具契约测试
        run: python -X utf8 -m unittest discover -s tests/repository -p "test_*.py"
      - name: 隐私、当前入口与首页进度
        run: python -X utf8 tools/repository/check_repository.py --worktree

