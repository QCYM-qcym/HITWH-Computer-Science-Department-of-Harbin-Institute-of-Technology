[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-anomaly-core"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy==2.5.4", "pydantic==2.14.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "jsonschema==4.26.0", "PyYAML==6.0.3"]
models = ["torch==2.14.1+cpu", "scikit-learn==1.9.1", "pyarrow==26.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["traffic_anomaly*"]
