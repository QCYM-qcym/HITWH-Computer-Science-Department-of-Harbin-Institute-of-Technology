<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>当前与历史模型对照 · 人工样例</title>
  <link rel="stylesheet" href="/candidate/viewer.css">
  <style>
    #capacity-table table{min-width:840px}#capacity-table th[scope=row]{font-family:inherit;min-width:210px}
    #capacity-context,#capacity-population,#capacity-pairs{overflow-wrap:anywhere}
    #capacity-evidence details{border-top:1px solid #e1e9e3;padding:12px 0}
    #capacity-evidence summary{cursor:pointer;overflow-wrap:anywhere}
    #capacity-evidence summary:focus-visible{outline:3px solid #ddad57;outline-offset:3px}
    #capacity-evidence pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:480px;overflow:auto;background:#f5f7f4;padding:14px;font-size:12px}
    #capacity-evidence p{overflow-wrap:anywhere}#capacity-table td{min-width:90px}
    @media(max-width:700px){#capacity-table th[scope=row]{min-width:190px}}
  </style>
</head>
<body><main id="capacity-viewer"></main><noscript>此页面需要启用 JavaScript，以读取已保存的人工对照报告。</noscript>
<script type="module" src="/candidate/capacity.mjs"></script></body>
</html>
